# configtx.yaml — RWRRN Stage 1 (TWS only), SmartBFT test channel
#
# Channel name for this bootstrap: root-resolver-test
# Consensus: SmartBFT, 4 consenters (orderer0-orderer3), TWSOrdererMSP
# Peer org: TWSOrgMSP (peer0, peer1)
#
# Paths below are relative to the cli container's working_dir
# (/opt/gopath/src/github.com/hyperledger/fabric/peer), matching the
# ./crypto-config -> crypto volume mount in docker-compose.yml.
#
# IMPORTANT #1: this file is a SINGLE YAML document. Do not add "---"
# document separators between top-level sections — configtxgen's
# Viper-based loader only reads the first YAML document in a
# multi-document file, silently hiding everything after the first "---"
# (hit and fixed 2026-09-03).
#
# IMPORTANT #2: with Channel capability V3_0, orderer endpoints must be
# defined ONLY at the organization level (OrdererEndpoints: under each
# orderer org in Organizations:). Do NOT also set a global Orderer.Addresses
# list — configtxgen rejects that combination with:
#   "global orderer endpoints exist, but can not be used with V3_0
#   capability" (hit and fixed 2026-09-03).
#
# IMPORTANT #3: do NOT add "Consortiums:" to the profile. Fabric v3.x has no
# system channel; configtxgen warns "'Consortiums' should be nil since
# system channel is no longer supported in Fabric v3.x" if present (hit
# 2026-09-03, removed).
#
# IMPORTANT #4: each Organization's MSPDir must contain a populated
# msp/cacerts/ (CA root cert) and msp/config.yaml (NodeOUs) at the ORG
# level, not just at node/admin level. A live Fabric CA does not create
# this automatically — see scripts/ca-bootstrap/06-provision-org-msp-cacerts.sh,
# which must run once before this profile can be used (hit and fixed
# 2026-09-03: "could not load a valid ca certificate from directory
# .../msp/cacerts").
#
# IMPORTANT #5: the Orderer capability group tops out at V2_0 in Fabric
# 3.1.5 — there is no "OrdererV3_0" constant in Fabric's
# common/capabilities/orderer.go (confirmed by source inspection,
# 2026-09-03). Setting Orderer.Capabilities: V3_0 fails at channel-join
# time (osnadmin) with:
#   "Orderer capability V3_0 is required but not supported"
# BFT consensus is activated via OrdererType: BFT (below) and the
# ConsenterMapping, NOT via an Orderer-level capability flag. Only the
# CHANNEL capability needs to be V3_0 for BFT — per the official BFT
# configuration doc ("the channel capabilities V3.0 flag must be set to
# true"). Application capability may independently be V3_0 or lower
# depending on desired chaincode/lifecycle features; kept at V3_0 here
# since peers are v3.1.5.

Organizations:

  - &TWSOrdererOrg
    Name: TWSOrdererMSP
    ID: TWSOrdererMSP
    MSPDir: crypto/ordererOrganizations/tws.rwrrn.recordweb.dev/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('TWSOrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('TWSOrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('TWSOrdererMSP.admin')"
    OrdererEndpoints:
      - orderer0.tws.rwrrn.recordweb.dev:7050
      - orderer1.tws.rwrrn.recordweb.dev:7150
      - orderer2.tws.rwrrn.recordweb.dev:7250
      - orderer3.tws.rwrrn.recordweb.dev:7350

  - &TWSOrg
    Name: TWSOrgMSP
    ID: TWSOrgMSP
    MSPDir: crypto/peerOrganizations/tws.rwrrn.recordweb.dev/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('TWSOrgMSP.admin', 'TWSOrgMSP.peer', 'TWSOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('TWSOrgMSP.admin', 'TWSOrgMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('TWSOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('TWSOrgMSP.peer')"
    AnchorPeers:
      - Host: peer0.tws.rwrrn.recordweb.dev
        Port: 7051

Capabilities:
  Channel: &ChannelCapabilities
    V3_0: true
  # See IMPORTANT #5 above: V2_0 is the highest Orderer capability that
  # exists in Fabric 3.1.5. Do not set V3_0 here.
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V3_0: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: BFT
  SmartBFT:
    RequestBatchMaxCount: 100
    RequestBatchMaxBytes: 10485760
    RequestBatchMaxInterval: 200ms
    IncomingMessageBufferSize: 200
    RequestPoolSize: 400
    RequestForwardTimeout: 2s
    RequestComplainTimeout: 20s
    RequestAutoRemoveTimeout: 3m
    ViewChangeResendInterval: 5s
    ViewChangeTimeout: 20s
    LeaderHeartbeatTimeout: 1m
    LeaderHeartbeatCount: 10
    CollectTimeout: 1s
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 100
    AbsoluteMaxBytes: 10 MB
    PreferredMaxBytes: 2 MB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  ConsenterMapping:
    - ID: 1
      Host: orderer0.tws.rwrrn.recordweb.dev
      Port: 7050
      MSPID: TWSOrdererMSP
      Identity: crypto/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer0.tws.rwrrn.recordweb.dev/msp/signcerts/cert.pem
      ClientTLSCert: crypto/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer0.tws.rwrrn.recordweb.dev/tls/server.crt
      ServerTLSCert: crypto/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer0.tws.rwrrn.recordweb.dev/tls/server.crt
    - ID: 2
      Host: orderer1.tws.rwrrn.recordweb.dev
      Port: 7150
      MSPID: TWSOrdererMSP
      Identity: crypto/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer1.tws.rwrrn.recordweb.dev/msp/signcerts/cert.pem
      ClientTLSCert: crypto/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer1.tws.rwrrn.recordweb.dev/tls/server.crt
      ServerTLSCert: crypto/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer1.tws.rwrrn.recordweb.dev/tls/server.crt
    - ID: 3
      Host: orderer2.tws.rwrrn.recordweb.dev
      Port: 7250
      MSPID: TWSOrdererMSP
      Identity: crypto/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer2.tws.rwrrn.recordweb.dev/msp/signcerts/cert.pem
      ClientTLSCert: crypto/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer2.tws.rwrrn.recordweb.dev/tls/server.crt
      ServerTLSCert: crypto/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer2.tws.rwrrn.recordweb.dev/tls/server.crt
    - ID: 4
      Host: orderer3.tws.rwrrn.recordweb.dev
      Port: 7350
      MSPID: TWSOrdererMSP
      Identity: crypto/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer3.tws.rwrrn.recordweb.dev/msp/signcerts/cert.pem
      ClientTLSCert: crypto/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer3.tws.rwrrn.recordweb.dev/tls/server.crt
      ServerTLSCert: crypto/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer3.tws.rwrrn.recordweb.dev/tls/server.crt
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:

  RootResolverTestApplicationGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *TWSOrdererOrg
      Capabilities:
        <<: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *TWSOrg
      Capabilities:
        <<: *ApplicationCapabilities
