# Hyperledger Fabric — RecordWeb RootResolver Network (RWRRN)
# Stage 1: TWS only — 1 org (TWSOrg), 1 Fabric CA, 4 orderers (SmartBFT), 2 peers
# Fabric 3.1.x
#
# CHANGE LOG (this revision):
#   - cli service no longer uses hyperledger/fabric-tools (Docker Hub image
#     discontinued since Fabric v3.0 — confirmed via hyperledger/fabric issue
#     #5178). It now BUILDS a custom image from ./fabric-tools/Dockerfile.tools,
#     which bundles the official Fabric 3.1.x release binaries (peer,
#     configtxgen, configtxlator, cryptogen, osnadmin) plus fabric-ca-client
#     (Fabric CA 1.5.x) in one image. Docker Compose builds this automatically
#     on `docker compose up -d` if the image doesn't exist yet or the
#     Dockerfile changed — no manual build step required.
#   - This same image now also replaces the temporary "run fabric-ca-client
#     inside the CA server container" workaround used during initial
#     bootstrap (Option A -> Option B transition, agreed 2026-09-03). Bootstrap
#     scripts (01-04) should now be run from THIS cli container instead of
#     the ca.tws... container — see updated script headers.
#   - Fabric images bumped from 2.5 -> 3.1 for orderer/peer (fabric-ca stays
#     1.5, versioned independently, compatible with Fabric 3.x networks).
#   - Orderer count increased from 2 to 4 (orderer0-orderer3): SmartBFT
#     requires a minimum of 4 consenters (3F+1, F=1) for any fault tolerance.
#   - Orderer port scheme: flat +100 offset per orderer from orderer0.
#       orderer0: 7050 (general) / 7053 (admin) / 9443 (ops)
#       orderer1: 7150 (general) / 7153 (admin) / 9543 (ops)
#       orderer2: 7250 (general) / 7253 (admin) / 9643 (ops)
#       orderer3: 7350 (general) / 7353 (admin) / 9743 (ops)
#     orderer1 previously ran on 8050/8053/9446 — breaking port change, update
#     firewall rules accordingly.
#   - ORDERER_GENERAL_LOCALMSPID corrected from placeholder "OrdererMSP" to
#     the agreed "TWSOrdererMSP" (Model B: TWS runs its own dedicated
#     orderer-org MSP, distinct from TWSOrgMSP used by peers).
#   - Consensus type (Raft vs BFT) is a CHANNEL configuration concern
#     (OrdererType in configtx), not a docker-compose/env concern. This file
#     only prepares infrastructure (4 running orderer nodes with valid crypto
#     material); the actual BFT channel bootstrap (genesis block /
#     ConsenterMapping) is a separate, later step.
#
# Hostnames (DNS + firewall must be updated by the operator before deploy):
#   ca.tws.rwrrn.recordweb.dev       - Fabric CA (port 7054)
#   orderer0.tws.rwrrn.recordweb.dev - Orderer 0 (7050 general / 7053 admin / 9443 ops)
#   orderer1.tws.rwrrn.recordweb.dev - Orderer 1 (7150 general / 7153 admin / 9543 ops)
#   orderer2.tws.rwrrn.recordweb.dev - Orderer 2 (7250 general / 7253 admin / 9643 ops)
#   orderer3.tws.rwrrn.recordweb.dev - Orderer 3 (7350 general / 7353 admin / 9743 ops)
#   peer0.tws.rwrrn.recordweb.dev    - Peer 0 (7051 peer / 7052 chaincode / 9444 ops)
#   peer1.tws.rwrrn.recordweb.dev    - Peer 1 (8051 peer / 8052 chaincode / 9445 ops)
#
# State database: LevelDB (no CouchDB service - per RootResolver-Network.md Section 4.2)
# Crypto material: live Fabric CA server (not cryptogen) - per Config-and-Progress.md Step 1.4

networks:
  rwrrn_net:
    name: rwrrn_net
    driver: bridge

volumes:
  ca_data:
  orderer0_data:
  orderer1_data:
  orderer2_data:
  orderer3_data:
  peer0_data:
  peer1_data:

services:

  # ── Fabric CA — issues all identities for TWSOrg ───────────────────────────
  ca.tws.rwrrn.recordweb.dev:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.tws.rwrrn.recordweb.dev
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-tws
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_CSR_CN=ca.tws.rwrrn.recordweb.dev
      - FABRIC_CA_SERVER_CSR_HOSTS=ca.tws.rwrrn.recordweb.dev,localhost
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./fabric-ca/tws:/etc/hyperledger/fabric-ca-server
      - ca_data:/etc/hyperledger/fabric-ca-server/data
      - ./crypto-config:/etc/hyperledger/crypto-config
      - ./.env:/etc/hyperledger/.env:ro
      - ./scripts:/etc/hyperledger/scripts:ro
    networks:
      - rwrrn_net

  # ── Orderer 0 ────────────────────────────────────────────────────────────
  orderer0.tws.rwrrn.recordweb.dev:
    image: hyperledger/fabric-orderer:3.1
    container_name: orderer0.tws.rwrrn.recordweb.dev
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=TWSOrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
      - ORDERER_METRICS_PROVIDER=prometheus
    volumes:
      - ./crypto-config/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer0.tws.rwrrn.recordweb.dev/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer0.tws.rwrrn.recordweb.dev/tls:/var/hyperledger/orderer/tls
      - orderer0_data:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
      - "9443:9443"
    networks:
      - rwrrn_net

  # ── Orderer 1 ────────────────────────────────────────────────────────────
  orderer1.tws.rwrrn.recordweb.dev:
    image: hyperledger/fabric-orderer:3.1
    container_name: orderer1.tws.rwrrn.recordweb.dev
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7150
      - ORDERER_GENERAL_LOCALMSPID=TWSOrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7153
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:9543
      - ORDERER_METRICS_PROVIDER=prometheus
    volumes:
      - ./crypto-config/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer1.tws.rwrrn.recordweb.dev/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer1.tws.rwrrn.recordweb.dev/tls:/var/hyperledger/orderer/tls
      - orderer1_data:/var/hyperledger/production/orderer
    ports:
      - "7150:7150"
      - "7153:7153"
      - "9543:9543"
    networks:
      - rwrrn_net

  # ── Orderer 2 (SmartBFT minimum of 4 consenters) ──────────────────────────
  orderer2.tws.rwrrn.recordweb.dev:
    image: hyperledger/fabric-orderer:3.1
    container_name: orderer2.tws.rwrrn.recordweb.dev
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7250
      - ORDERER_GENERAL_LOCALMSPID=TWSOrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7253
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:9643
      - ORDERER_METRICS_PROVIDER=prometheus
    volumes:
      - ./crypto-config/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer2.tws.rwrrn.recordweb.dev/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer2.tws.rwrrn.recordweb.dev/tls:/var/hyperledger/orderer/tls
      - orderer2_data:/var/hyperledger/production/orderer
    ports:
      - "7250:7250"
      - "7253:7253"
      - "9643:9643"
    networks:
      - rwrrn_net

  # ── Orderer 3 (SmartBFT minimum of 4 consenters) ──────────────────────────
  orderer3.tws.rwrrn.recordweb.dev:
    image: hyperledger/fabric-orderer:3.1
    container_name: orderer3.tws.rwrrn.recordweb.dev
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7350
      - ORDERER_GENERAL_LOCALMSPID=TWSOrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7353
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:9743
      - ORDERER_METRICS_PROVIDER=prometheus
    volumes:
      - ./crypto-config/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer3.tws.rwrrn.recordweb.dev/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/tws.rwrrn.recordweb.dev/orderers/orderer3.tws.rwrrn.recordweb.dev/tls:/var/hyperledger/orderer/tls
      - orderer3_data:/var/hyperledger/production/orderer
    ports:
      - "7350:7350"
      - "7353:7353"
      - "9743:9743"
    networks:
      - rwrrn_net

  # ── Peer 0 (TWSOrg) ─────────────────────────────────────────────────────────
  peer0.tws.rwrrn.recordweb.dev:
    image: hyperledger/fabric-peer:3.1
    container_name: peer0.tws.rwrrn.recordweb.dev
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=rwrrn_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.tws.rwrrn.recordweb.dev
      - CORE_PEER_ADDRESS=peer0.tws.rwrrn.recordweb.dev:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.tws.rwrrn.recordweb.dev:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.tws.rwrrn.recordweb.dev:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.tws.rwrrn.recordweb.dev:7051
      - CORE_PEER_LOCALMSPID=TWSOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/tws.rwrrn.recordweb.dev/peers/peer0.tws.rwrrn.recordweb.dev/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/tws.rwrrn.recordweb.dev/peers/peer0.tws.rwrrn.recordweb.dev/tls:/etc/hyperledger/fabric/tls
      - peer0_data:/var/hyperledger/production
    ports:
      - "7051:7051"
    networks:
      - rwrrn_net

  # ── Peer 1 (TWSOrg) ─────────────────────────────────────────────────────────
  peer1.tws.rwrrn.recordweb.dev:
    image: hyperledger/fabric-peer:3.1
    container_name: peer1.tws.rwrrn.recordweb.dev
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=rwrrn_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer1.tws.rwrrn.recordweb.dev
      - CORE_PEER_ADDRESS=peer1.tws.rwrrn.recordweb.dev:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer1.tws.rwrrn.recordweb.dev:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.tws.rwrrn.recordweb.dev:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.tws.rwrrn.recordweb.dev:8051
      - CORE_PEER_LOCALMSPID=TWSOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9445
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/tws.rwrrn.recordweb.dev/peers/peer1.tws.rwrrn.recordweb.dev/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/tws.rwrrn.recordweb.dev/peers/peer1.tws.rwrrn.recordweb.dev/tls:/etc/hyperledger/fabric/tls
      - peer1_data:/var/hyperledger/production
    ports:
      - "8051:8051"
    networks:
      - rwrrn_net

  # ── CLI / Admin tools — custom-built image (see fabric-tools/Dockerfile.tools)
  #    Replaces the discontinued hyperledger/fabric-tools Docker Hub image AND
  #    the temporary "run fabric-ca-client inside the CA container" workaround.
  #    Contains: peer, configtxgen, configtxlator, cryptogen, osnadmin,
  #    fabric-ca-client — everything needed for channel bootstrap and ongoing
  #    CA operations, in one place. ───────────────────────────────────────────
  cli:
    build:
      context: ./fabric-tools
      dockerfile: Dockerfile.tools
      args:
        FABRIC_VERSION: "3.1.5"
        FABRIC_CA_VERSION: "1.5.22"
    image: rwrrn-fabric-tools:3.1.5
    container_name: rwrrn-cli
    tty: true
    stdin_open: true
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.tws.rwrrn.recordweb.dev:7051
      - CORE_PEER_LOCALMSPID=TWSOrgMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/tws.rwrrn.recordweb.dev/peers/peer0.tws.rwrrn.recordweb.dev/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/tws.rwrrn.recordweb.dev/peers/peer0.tws.rwrrn.recordweb.dev/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/tws.rwrrn.recordweb.dev/peers/peer0.tws.rwrrn.recordweb.dev/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/tws.rwrrn.recordweb.dev/users/tws-org-admin/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto
      - ./channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ./scripts:/opt/gopath/src/github.com/hyperledger/fabric/peer/scripts
      - ./fabric-ca:/opt/gopath/src/github.com/hyperledger/fabric/peer/fabric-ca:ro
      - ./.env:/opt/gopath/src/github.com/hyperledger/fabric/peer/.env:ro
    networks:
      - rwrrn_net
    depends_on:
      - peer0.tws.rwrrn.recordweb.dev
      - peer1.tws.rwrrn.recordweb.dev
      - orderer0.tws.rwrrn.recordweb.dev
      - orderer1.tws.rwrrn.recordweb.dev
      - orderer2.tws.rwrrn.recordweb.dev
      - orderer3.tws.rwrrn.recordweb.dev
