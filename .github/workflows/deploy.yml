name: Deploy RWRRN to VPS

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Docker Compose service to start (or "all")'
        required: true
        default: 'ca.tws.rwrrn.recordweb.dev'
        type: choice
        options:
          - ca.tws.rwrrn.recordweb.dev
          - orderer0.tws.rwrrn.recordweb.dev
          - orderer1.tws.rwrrn.recordweb.dev
          - peer0.tws.rwrrn.recordweb.dev
          - peer1.tws.rwrrn.recordweb.dev
          - cli
          - all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/rwrrn

            git fetch origin
            git reset --hard origin/main
            git clean -fd

            cd network

            if [ "${{ github.event.inputs.service }}" = "all" ]; then
              docker compose up -d
            else
              docker compose up -d "${{ github.event.inputs.service }}"
            fi

            docker compose ps