name: Deploy RWRRN to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Docker Compose service to start (or "all")'
        required: true
        default: 'ca.tws.rwrrn.recordweb.dev'
        type: choice
        options:
          - ca.tws.rwrrn.recordweb.dev
          - orderer0.tws.rwrrn.recordweb.dev
          - orderer1.tws.rwrrn.recordweb.dev
          - peer0.tws.rwrrn.recordweb.dev
          - peer1.tws.rwrrn.recordweb.dev
          - cli
          - all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: GIT_TERMINAL_PROMPT
          script: |
            set -euo pipefail
            export GIT_TERMINAL_PROMPT=0

            echo "--- DNS/network check ---"
            getent hosts github.com || true
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://github.com || true

            echo "--- git ls-remote debug ---"
            GIT_CURL_VERBOSE=1 git ls-remote https://github.com/recordweb/rwrrn.git 2>&1 | tail -n 40

            if [ ! -d /opt/rwrrn/.git ]; then
              echo "Repo not found at /opt/rwrrn — cloning..."
              mkdir -p /opt/rwrrn
              git clone https://github.com/recordweb/rwrrn.git /opt/rwrrn
            fi

            cd /opt/rwrrn
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            cd network